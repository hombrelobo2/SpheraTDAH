name: Limpiar releases antiguas

# Tarea de un solo uso: borra las releases (y sus etiquetas) listadas en .github/cleanup-releases.txt.
on:
  push:
    branches: [main]
    paths: ['.github/cleanup-releases.txt']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Borrar releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" && echo "borrada: $tag" || echo "no existe: $tag"
          done < .github/cleanup-releases.txt
