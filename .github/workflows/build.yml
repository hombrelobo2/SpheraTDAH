# Compila el APK firmado en cada cambio y lo publica en "Releases".
# - Cada versión tiene su publicación: vX.Y.Z con sphera_X.Y.Z.apk
# - La publicación "ultima" es un enlace fijo con Sphera.apk y version.json:
#   la app consulta version.json para avisar de versiones nuevas.
# La versión se define en app/build.gradle.kts (versionName / versionCode).

name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

# Una compilación cada vez, para que no se pisen al publicar.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Leer la versión
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VCODE=$VCODE" >> "$GITHUB_ENV"
          echo "APK=sphera_$VERSION.apk" >> "$GITHUB_ENV"
          echo "Versión: $VERSION ($VCODE)"

      - name: Preparar firma
        env:
          SPHERA_KEYSTORE: ${{ secrets.SPHERA_KEYSTORE }}
        run: |
          if [ -z "$SPHERA_KEYSTORE" ]; then
            echo "::error::Faltan los secrets SPHERA_KEYSTORE y SPHERA_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$SPHERA_KEYSTORE" | base64 -d > "$RUNNER_TEMP/sphera.jks"
          echo "SPHERA_KEYSTORE_PATH=$RUNNER_TEMP/sphera.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          SPHERA_KEYSTORE_PASSWORD: ${{ secrets.SPHERA_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          rm -f "$SPHERA_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cp "$APK" Sphera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sphera_${{ env.VERSION }}
          path: ${{ env.APK }}

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="Sphera $VERSION (commit ${GITHUB_SHA::7}). Descarga $APK e instálalo encima de la versión anterior: no se pierde nada."
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Misma versión recompilada: se sustituye el APK.
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "Sphera $VERSION" --notes "$NOTES" $PRE --latest
          fi

      - name: Actualizar el enlace fijo (avisos de versión nueva)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/$APK"
          printf '{"versionName":"%s","versionCode":%s,"apkUrl":"%s"}\n' "$VERSION" "$VCODE" "$URL" > version.json
          cat version.json
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima "$APK" Sphera.apk version.json \
            --title "Enlace fijo a la última versión ($VERSION)" \
            --notes "Última versión ($VERSION): descarga $APK. Sphera.apk es la misma con nombre fijo. version.json lo usa la app para avisar de versiones nuevas. El historial está en las publicaciones vX.Y.Z." \
            --latest=false
